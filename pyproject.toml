[project]
name = "capstone"
version = "0.1.0"
description = "Add your description here"
authors = [
    { email = "ramakris99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rapidocr>=3,<4",
    "onnxruntime>=1.17,<2",
    "qdrant-client>=1.12,<2",
    "pymupdf>=1.24,<2",
    "reportlab>=4,<5",
    "fastapi>=0.115.0",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.7",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.0.0",
    "langsmith>=0.6.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "pytest>=8.0.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3.0,<6",
    "streamlit>=1.40.0",
    "tqdm>=4.70.1",
    "transformers>=4.57.0,<5",
    "torch>=2.9.0",
    "torchvision>=0.21.0",
    "accelerate>=1,<2",
    "uvicorn>=0.30.0",
]

[project.scripts]
capstone-global = "capstone_global:main"

[project.optional-dependencies]
colpali = ["bitsandbytes>=0.48,<1"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
